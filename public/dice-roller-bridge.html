<!doctype html>
<html lang='en'> 
<head>
    <meta charset='UTF-8' />
    <title>3D Dice Roller Bridge</title>
    <meta name='viewport' content='width=device-width, initial-scale=1.0' /> 
    <link rel='stylesheet' href='styles.css' />
</head>
<body>

    <div id="diceRoller" style="width: 100%; height: 100%;">
        <!-- dice_box gets created here -->
    </div>

    <script src="libs/three.min.js"></script>
    <script src="libs/cannon.min.js"></script>
    <script src="libs/teal.js"></script>
    <script src="dice.js"></script>
    <script src="main.js"></script>
    <script>
        // Bridge script
        (function() {
            let box;
            let currentSlotIndex;
            let currentUserId;

            function init() {
                console.log('[Dice Bridge] Initializing...');
                const container = document.getElementById('diceRoller');
                if (!container) {
                    console.error('[Dice Bridge] Container not found');
                    window.parent.postMessage({ type: 'iframe_init_failed', error: 'Container not found' }, '*');
                    return;
                }
                
                try {
                    box = new DICE.dice_box(container);
                    box.setDice('1d20');
                    box.bind_swipe(container, before_roll, after_roll);
                    container.addEventListener('click', function() {
                        console.log('[Dice Bridge] Click detected, rolling dice...');
                        box.start_throw(before_roll, after_roll);
                    });
                    console.log('[Dice Bridge] Initialization complete.');
                    window.parent.postMessage({ type: 'iframe_ready' }, '*');
                } catch (e) {
                    console.error('[Dice Bridge] Initialization failed:', e);
                    window.parent.postMessage({ type: 'iframe_init_failed', error: e.message }, '*');
                }
            }

            function before_roll(notation) {
                window.parent.postMessage({ type: 'roll_started' }, '*');
                return null;
            }

            function after_roll(notation) {
                const result = notation.resultTotal;
                window.parent.postMessage({ 
                    type: 'DICE_ROLL_RESULT', 
                    result: result
                }, '*');
            }

            window.addEventListener('message', function(event) {
                const { type, notation, slotIndex, userId } = event.data;

                if (type === 'set_roll_context') {
                    currentSlotIndex = slotIndex;
                    currentUserId = userId;
                } else if (type === 'user_interaction' && event.data.action === 'click') {
                    if (box) {
                        box.start_throw(before_roll, after_roll);
                    }
                }
            });

            // Initialize the dice box when the page loads
            window.addEventListener('load', init);
        })();
    </script>
</body>
</html>
