<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dice Box Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #1a1a1a;
            color: white;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #2a2a2a;
            padding: 20px;
            border-radius: 10px;
            border: 2px solid #3b82f6;
        }
        .dice-box {
            width: 100%;
            height: 400px;
            border: 2px solid #ef4444;
            border-radius: 8px;
            margin: 20px 0;
            position: relative;
        }
        .debug-info {
            background: #111;
            padding: 10px;
            border-radius: 5px;
            font-family: monospace;
            font-size: 12px;
            max-height: 200px;
            overflow-y: auto;
        }
        .status {
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            background: #333;
        }
        .status.ready { background: #16a34a; }
        .status.rolling { background: #f59e0b; }
        .status.error { background: #ef4444; }
        button {
            padding: 10px 20px;
            margin: 5px;
            border: none;
            border-radius: 5px;
            background: #3b82f6;
            color: white;
            cursor: pointer;
        }
        button:hover {
            background: #2563eb;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Dice Box Fix Test</h1>
        <p>This test page helps verify that the dice box is recording values correctly.</p>
        
        <div class="status" id="status">Status: Loading...</div>
        
        <div class="dice-box" id="diceBox">
            <iframe
                id="diceIframe"
                src="/dice-roller-bridge.html"
                title="3D Dice Roller"
                class="w-full h-full border-none"
                sandbox="allow-scripts allow-same-origin"
                style="width: 100%; height: 100%; border: none;"
            ></iframe>
            
            <div id="overlay" class="overlay" style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; cursor: pointer; display: none;"></div>
        </div>
        
        <div style="display: flex; gap: 10px; flex-wrap: wrap;">
            <button onclick="testRoll()">Test Roll (1d20)</button>
            <button onclick="testRoll('1d6')">Roll 1d6</button>
            <button onclick="testRoll('2d6')">Roll 2d6</button>
            <button onclick="clearDebug()">Clear Debug</button>
        </div>
        
        <h3>Debug Information:</h3>
        <div class="debug-info" id="debugInfo"></div>
    </div>

    <script>
        let diceBoxReady = false;
        let isRolling = false;
        let iframe = null;
        
        function log(message) {
            const debugInfo = document.getElementById('debugInfo');
            const timestamp = new Date().toLocaleTimeString();
            debugInfo.innerHTML += `[${timestamp}] ${message}<br>`;
            debugInfo.scrollTop = debugInfo.scrollHeight;
            console.log(message);
        }
        
        function updateStatus(message, type = '') {
            const status = document.getElementById('status');
            status.textContent = `Status: ${message}`;
            status.className = `status ${type}`;
        }
        
        function showOverlay(show) {
            const overlay = document.getElementById('overlay');
            overlay.style.display = show ? 'block' : 'none';
        }
        
        function handleIframeMessage(event) {
            log(`Received message: ${JSON.stringify(event.data)}`);
            
            switch (event.data?.type) {
                case 'DICE_BOX_READY':
                    log('Dice box is ready!');
                    diceBoxReady = true;
                    updateStatus('Ready - Click the dice box to roll!', 'ready');
                    showOverlay(true);
                    break;
                    
                case 'ROLL_STARTED':
                    log('Roll started');
                    isRolling = true;
                    updateStatus('Rolling...', 'rolling');
                    break;
                    
                case 'ROLL_RESULT':
                    log(`Roll result: ${event.data.notation.resultTotal}`);
                    log(`Full result: ${JSON.stringify(event.data.notation)}`);
                    isRolling = false;
                    updateStatus(`Roll complete: ${event.data.notation.resultTotal}`, '');
                    showOverlay(true);
                    break;
                    
                case 'DICE_OFF_TABLE':
                    log('Dice off table detected');
                    isRolling = false;
                    updateStatus('Dice off table - try again', 'error');
                    showOverlay(true);
                    break;
            }
        }
        
        function testRoll(diceNotation = '1d20') {
            if (!diceBoxReady) {
                log('Dice box not ready yet');
                updateStatus('Dice box not ready - waiting...', 'error');
                return;
            }
            
            if (isRolling) {
                log('Already rolling, please wait');
                return;
            }
            
            log(`Sending roll command: ${diceNotation}`);
            iframe.postMessage({ type: 'ROLL', diceNotation }, '*');
            isRolling = true;
            updateStatus('Rolling...', 'rolling');
            showOverlay(false);
        }
        
        function clearDebug() {
            document.getElementById('debugInfo').innerHTML = '';
        }
        
        // Initialize
        window.addEventListener('message', handleIframeMessage);
        
        window.onload = function() {
            iframe = document.getElementById('diceIframe');
            log('Page loaded, waiting for dice box to be ready...');
            updateStatus('Waiting for dice box...', '');
            
            // Add click handler to the dice box
            document.getElementById('diceBox').addEventListener('click', function(e) {
                if (e.target.id === 'diceIframe') return; // Don't trigger on iframe itself
                testRoll();
            });
        };
    </script>
</body>
</html>
